name: Pipeline Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: uv sync

      - name: Set test environment
        run: |
          echo "GCS_BUCKET_NAME=test-bucket" >> "$GITHUB_ENV"
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/test-credentials.json" >> "$GITHUB_ENV"
          echo "DB_PASSWORD=test-password" >> "$GITHUB_ENV"

      - name: Run Tests
        run: uv run pytest tests/ -v --tb=short

      - name: Validate Schemas
        run: uv run python scripts/validate_schemas.py